services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loci}
      POSTGRES_USER: ${POSTGRES_USER:-loci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-loci} -d ${POSTGRES_DB:-loci}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - loci-postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?OWNER_PASSWORD_HASH is required}
      CHAT_API_KEY: ${CHAT_API_KEY:?CHAT_API_KEY is required}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.anthropic.com}
      CHAT_MODEL: ${CHAT_MODEL:?CHAT_MODEL is required}
      COMPRESSION_API_KEY: ${COMPRESSION_API_KEY:-}
      COMPRESSION_BASE_URL: ${COMPRESSION_BASE_URL:-}
      COMPRESSION_MODEL: ${COMPRESSION_MODEL:-}
      CONSOLIDATION_API_KEY: ${CONSOLIDATION_API_KEY:-}
      CONSOLIDATION_BASE_URL: ${CONSOLIDATION_BASE_URL:-}
      CONSOLIDATION_MODEL: ${CONSOLIDATION_MODEL:-}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY:-}
      EXTRACTION_BASE_URL: ${EXTRACTION_BASE_URL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  loci-postgres:
  caddy-data:
  caddy-config:
